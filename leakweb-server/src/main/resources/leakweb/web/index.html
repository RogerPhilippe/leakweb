<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeakWeb</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/leaks">
      <img src="favicon.svg" alt="" width="22" height="22">
      <span>LeakWeb</span>
    </a>
    <span class="app-name" id="app-name"></span>
    <div class="live" id="live" hidden>
      <span class="live-label" id="live-label"></span>
      <progress id="live-progress" max="100"></progress>
    </div>
    <div class="actions">
      <span class="connection" id="connection" title="Connection to the app (events)">Connecting</span>
      <button type="button" id="gc-button">Run GC</button>
      <button type="button" id="dump-button" class="primary">Dump heap</button>
      <button type="button" id="theme-button" class="icon-button" title="Theme">◐</button>
    </div>
  </header>

  <nav class="sidebar" aria-label="Sections">
    <a href="#/leaks" data-section="leaks">Leaks <span class="badge" id="leak-count"></span></a>
    <a href="#/retained" data-section="retained">Retained <span class="badge" id="retained-count"></span></a>
    <a href="#/memory" data-section="memory">Memory</a>
    <a href="#/analyses" data-section="analyses">Analyses</a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <lw-toasts></lw-toasts>
</body>
</html>
