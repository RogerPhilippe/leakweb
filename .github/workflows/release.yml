name: Release

# Pushing a tag such as v0.1.0 builds the AARs/JARs and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Build artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew -Pversion="$VERSION" \
            :leakweb-android:assembleRelease :leakweb-noop:assembleRelease \
            :leakweb-api:jar :leakweb-model:jar :leakweb-watcher:jar \
            :leakweb-analyzer:jar :leakweb-server:jar
          mkdir dist
          for module in leakweb-android leakweb-noop; do
            cp "$module/build/outputs/aar/$module-release.aar" "dist/$module-$VERSION.aar"
          done
          for module in leakweb-api leakweb-model leakweb-watcher leakweb-analyzer leakweb-server; do
            cp "$module/build/libs/$module-$VERSION.jar" dist/
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
